<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant Atlas</title>
<meta name="description" content="A personal world map with a dot for every plant visited.">
<meta name="theme-color" content="#141D26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plant Atlas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: map first and full width, a stat strip above it, the plant list and backup below.
   Editing turns the screen into map on top, form below, so the pin stays visible on a phone. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#141D26; --muted:#5A6774; --line:#D8DEE4;
  --ocean:#E2E9EF; --land:#FCFDFD; --border:#C3CDD6; --visited:#F5D5B0;
  --dot:#C9430C; --dot-ring:#FFFFFF; --pin:#1F5FBF; --danger:#B42318;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1217; --surface:#151C23; --ink:#E5EBF0; --muted:#94A2AF; --line:#26313B;
  --ocean:#0A0F14; --land:#1A232C; --border:#33414E; --visited:#5A3B22;
  --dot:#FF8B4D; --dot-ring:#0D1217; --pin:#7FB0FF; --danger:#FF8A80; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{color:var(--ink);font:15px/1.5 var(--f-body);padding:0 16px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font:700 clamp(28px,6vw,40px)/1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.home{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--ink);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat b{display:block;font:700 clamp(20px,5vw,28px)/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

.mapwrap{position:relative;height:clamp(320px,58vh,640px);border-radius:12px;overflow:hidden;background:var(--ocean);border:1px solid var(--line);touch-action:none}
.mapwrap svg{display:block;width:100%;height:100%;cursor:grab}
.sphere{fill:var(--ocean)}
.country{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .3s}
.country.visited{fill:var(--visited)}
.dot{fill:var(--dot);stroke:var(--dot-ring);stroke-width:1.5;cursor:pointer}
.dot.sel{stroke:var(--ink);stroke-width:2.5}
.pin{fill:none;stroke:var(--pin);stroke-width:2.5}
.pin-c{fill:var(--pin)}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 20px/1 var(--f-body);cursor:pointer}
.maphint{position:absolute;left:10px;top:10px;right:60px;font-size:13px;color:var(--muted);pointer-events:none}
.maphint b{color:var(--ink)}
.card{position:absolute;left:10px;right:10px;bottom:10px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 6px 20px rgb(0 0 0 / .12)}
.card h3{margin:0;font:700 18px/1.2 var(--f-display);overflow-wrap:anywhere}
.card .meta{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-body);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;min-height:52px;padding:0 22px;border-radius:26px;box-shadow:0 6px 20px rgb(0 0 0 / .2)}

section h2{font:700 20px/1.2 var(--f-display);margin:8px 0}
.group{display:grid;margin-bottom:14px}
.group h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-top:0;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.item:first-of-type{border-top:1px solid var(--line);border-radius:8px 8px 0 0}
.item:last-child{border-radius:0 0 8px 8px}
.item:only-of-type{border-radius:8px}
.item .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .p{font-size:13px;color:var(--muted);grid-column:1;min-width:0}
.item .v{grid-row:1/3;grid-column:2;font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--border);border-radius:10px;padding:18px;color:var(--muted);margin:0}
.backup{border-top:1px solid var(--line);padding-top:8px}
.backup p{color:var(--muted);font-size:14px;margin:0 0 10px;max-width:60ch}

/* editor: map on top, form below */
body.editing .fab{display:none}
body.editing .mapwrap{position:fixed;top:0;left:0;right:0;height:calc(42dvh + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);z-index:30;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(42dvh + env(safe-area-inset-top,0px));z-index:31;background:var(--bg);overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet form{max-width:560px;margin:0 auto;display:grid;gap:14px}
.sheet h2{margin:0;font:700 22px/1.2 var(--f-display)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text]{width:100%;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:16px var(--f-body)}
.locrow{display:flex;gap:8px}
.locrow input{flex:1;min-width:0}
.note{font-size:13px;color:var(--muted);margin:0}
.note.err{color:var(--danger)}
.stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;width:max-content;background:var(--surface)}
.stepper button{width:44px;height:44px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.stepper output{min-width:40px;text-align:center;font:500 16px var(--f-mono)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Plant Atlas</h1>
    <div class="home" id="homeLine"></div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sPlants">0</b><span>Plants</span></div>
    <div class="stat"><b id="sCountries">0</b><span>Countries</span></div>
    <div class="stat"><b id="sVisits">0</b><span>Visits</span></div>
    <div class="stat"><b id="sKm">0</b><span>Km travelled</span></div>
  </div>

  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="World map with a dot for every plant visited"></svg>
    <div class="maphint" id="maphint"></div>
    <div class="mapctl">
      <button type="button" id="zIn" aria-label="Zoom in">+</button>
      <button type="button" id="zOut" aria-label="Zoom out">−</button>
      <button type="button" id="zFit" aria-label="Show all plants" style="font-size:14px">All</button>
    </div>
    <div class="card" id="card" hidden></div>
  </div>

  <section>
    <h2>Plants by country</h2>
    <div id="list"></div>
  </section>

  <section class="backup">
    <h2>Backup</h2>
    <p id="backupNote">Your plants are saved on this device only. Export a backup now and then, and import it on a new phone.</p>
    <div class="row">
      <button type="button" class="btn" id="exportBtn">Export backup</button>
      <button type="button" class="btn" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</div>

<button type="button" class="btn primary fab" id="addBtn">Add plant</button>

<div class="sheet" id="sheet" hidden>
  <form id="form" autocomplete="off">
    <h2 id="fTitle">Add plant</h2>
    <label id="nameLbl">Plant or customer
      <input type="text" id="fName" maxlength="80" placeholder="e.g. Assembly plant, Brno">
    </label>
    <label>City and country
      <span class="locrow">
        <input type="text" id="fPlace" maxlength="120" placeholder="e.g. Brno, Czech Republic">
        <button type="button" class="btn" id="findBtn">Find</button>
      </span>
    </label>
    <div class="row">
      <button type="button" class="btn" id="hereBtn">Use my location</button>
    </div>
    <p class="note" id="locNote"></p>
    <div id="visitsBox">
      <label style="margin-bottom:4px">Visits</label>
      <div class="stepper">
        <button type="button" id="vMinus" aria-label="One visit less">−</button>
        <output id="vOut">1</output>
        <button type="button" id="vPlus" aria-label="One visit more">+</button>
      </div>
    </div>
    <p class="note err" id="formErr" hidden></p>
    <div class="actions">
      <div class="row">
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
      </div>
      <button type="button" class="btn danger" id="delBtn" hidden>Delete</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "plant-atlas-v1";
const DEFAULT_HOME = { place: "Bilzen, Belgium", lat: 50.8706, lon: 5.5181 };
const S = { plants: [], home: null, lastExport: null, features: [], selected: null, ed: null };

/* ---------- storage: this device only ---------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.plants)) { S.plants = d.plants.filter(validPlant); S.home = validHome(d.home) ? d.home : null; S.lastExport = d.lastExport || null; }
  } catch {}
  if (!S.home) S.home = { ...DEFAULT_HOME };
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ plants: S.plants, home: S.home, lastExport: S.lastExport })); return true; }
  catch { toast("Could not save on this device. Storage may be full or blocked."); return false; }
}
const validPlant = p => p && typeof p.name === "string" && isFinite(p.lat) && isFinite(p.lon);
const validHome = h => h && isFinite(h.lat) && isFinite(h.lon);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

/* ---------- map ---------- */
const svg = d3.select("#map");
const gWorld = svg.append("g");
const gDots = svg.append("g");
let projection, path, W = 0, H = 0, T = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([1, 80]).on("zoom", e => { T = e.transform; gWorld.attr("transform", T); placeDots(); });
svg.call(zoom).on("dblclick.zoom", null);

function layoutMap() {
  const box = $("mapwrap").getBoundingClientRect();
  if (!box.width || !S.features.length) return;
  W = box.width; H = box.height;
  projection = d3.geoNaturalEarth1().fitExtent([[8, 8], [W - 8, H - 8]], { type: "FeatureCollection", features: S.features });
  path = d3.geoPath(projection);
  gWorld.selectAll("*").remove();
  gWorld.append("path").attr("class", "sphere").datum({ type: "Sphere" }).attr("d", path);
  gWorld.selectAll(".country").data(S.features).join("path").attr("class", "country").attr("d", path);
  paintCountries(); placeDots();
}
new ResizeObserver(([e]) => {
  const { width, height } = e.contentRect;
  if (Math.abs(width - W) < 3 && Math.abs(height - H) < 3) return;
  layoutMap();
  if (S.ed?.lat != null) zoomToPoint(S.ed.lon, S.ed.lat, 6, 0); else fitPlants(0);
}).observe($("mapwrap"));

function xy(lon, lat) { const p = projection([lon, lat]); return [T.applyX(p[0]), T.applyY(p[1])]; }
const radius = v => Math.min(4.5 + 2.2 * Math.sqrt(Math.max(0, (v || 1) - 1)), 13);

function placeDots() {
  if (!projection) return;
  const sorted = [...S.plants].sort((a, b) => (b.visits || 1) - (a.visits || 1));
  // Plants in the same town share coordinates: fan them out in a small ring so every dot stays tappable.
  const same = d3.group(sorted, p => p.lat.toFixed(3) + "," + p.lon.toFixed(3));
  const pos = new Map();
  for (const ps of same.values()) ps.forEach((p, i) => {
    const [x, y] = xy(p.lon, p.lat), a = (2 * Math.PI * i) / ps.length, d = ps.length > 1 ? 9 : 0;
    pos.set(p.id, [x + d * Math.cos(a), y + d * Math.sin(a)]);
  });
  gDots.selectAll("circle.dot").data(sorted, d => d.id).join("circle")
    .attr("class", d => "dot" + (S.selected === d.id ? " sel" : ""))
    .attr("r", d => radius(d.visits))
    .attr("cx", d => pos.get(d.id)[0]).attr("cy", d => pos.get(d.id)[1])
    .on("click", (e, d) => { e.stopPropagation(); if (!S.ed) select(d.id); });
  const pin = S.ed && S.ed.lat != null ? [S.ed] : [];
  gDots.selectAll("g.pinG").data(pin).join(en => { const g = en.append("g").attr("class", "pinG");
      g.append("circle").attr("class", "pin").attr("r", 11); g.append("circle").attr("class", "pin-c").attr("r", 3.5); return g; })
    .attr("transform", d => `translate(${xy(d.lon, d.lat)})`);
}

function countryOf(lon, lat) {
  const f = S.features.find(f => d3.geoContains(f, [lon, lat]));
  return f ? f.properties.name : null;
}
function paintCountries() {
  const names = new Set(S.plants.map(p => p.country));
  gWorld.selectAll(".country").classed("visited", d => names.has(d.properties.name));
}

function zoomTo(t, ms = 650) { svg.transition().duration(ms).call(zoom.transform, t); }
function zoomToPoint(lon, lat, k = 6, ms = 650) {
  if (!projection) return;
  const [x, y] = projection([lon, lat]);
  zoomTo(d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-x, -y), ms);
}
function fitPlants(ms = 650) {
  if (!projection) return;
  if (!S.plants.length) return zoomTo(d3.zoomIdentity, ms);
  const pts = S.plants.map(p => projection([p.lon, p.lat]));
  const [x0, x1] = d3.extent(pts, p => p[0]), [y0, y1] = d3.extent(pts, p => p[1]);
  const k = Math.max(1, Math.min(8, 0.75 / Math.max((x1 - x0) / W, (y1 - y0) / H, 1e-3)));
  zoomTo(d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2), ms);
}
$("zIn").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 2);
$("zOut").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 0.5);
$("zFit").onclick = () => fitPlants();

function setPin(lon, lat, country) {
  Object.assign(S.ed, { lon, lat, country: countryOf(lon, lat) || country || S.ed.country || "Unknown" });
  placeDots();
}
svg.on("click", e => {
  if (S.ed && projection) {
    const [mx, my] = d3.pointer(e);
    const [lon, lat] = projection.invert(T.invert([mx, my]));
    if (!isFinite(lon) || !isFinite(lat)) return;
    setPin(lon, lat);
    locNote(`Pin set by hand${S.ed.country !== "Unknown" ? " in " + S.ed.country : ""}.`);
  } else select(null);
});

/* ---------- distances & rendering ---------- */
function km(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}
const fmt = n => Math.round(n).toLocaleString("en-US");
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

function renderStats() {
  $("sPlants").textContent = S.plants.length;
  $("sCountries").textContent = new Set(S.plants.map(p => p.country)).size;
  $("sVisits").textContent = S.plants.reduce((s, p) => s + (p.visits || 1), 0);
  $("sKm").textContent = fmt(S.plants.reduce((s, p) => s + 2 * km(S.home, p) * (p.visits || 1), 0));
  const hl = $("homeLine"); hl.replaceChildren();
  const t = document.createElement("span");
  t.textContent = `From ${S.home.place}: round trip per visit, straight-line distance.`;
  const b = document.createElement("button"); b.type = "button"; b.className = "linkbtn";
  b.textContent = "Change home base"; b.onclick = () => openEditor("home");
  hl.append(t, b);
}

function renderList() {
  const box = $("list"); box.replaceChildren();
  if (!S.plants.length) { box.innerHTML = '<p class="empty">No plants yet. Tap <b>Add plant</b>, type the city or use your location, and the first dot appears on the map.</p>'; return; }
  const groups = d3.groups(S.plants, p => p.country).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  for (const [country, plants] of groups) {
    const g = document.createElement("div"); g.className = "group";
    const h = document.createElement("h4"); h.textContent = `${country} · ${plants.length}`; g.append(h);
    for (const p of [...plants].sort((a, b) => a.name.localeCompare(b.name))) {
      const b = document.createElement("button"); b.type = "button"; b.className = "item";
      const n = document.createElement("span"); n.className = "n"; n.textContent = p.name;
      const pl = document.createElement("span"); pl.className = "p"; pl.textContent = p.place;
      const v = document.createElement("span"); v.className = "v"; v.textContent = `${fmt(km(S.home, p))} km · ${p.visits || 1}×`;
      b.append(n, pl, v);
      b.onclick = () => { select(p.id); zoomToPoint(p.lon, p.lat, 6); $("mapwrap").scrollIntoView({ behavior: "smooth", block: "center" }); };
      g.append(b);
    }
    box.append(g);
  }
}

function renderBackup() {
  $("backupNote").textContent = "Your plants are saved on this device only. " +
    (S.lastExport ? `Last backup: ${fmtDate(S.lastExport)}.` : "No backup made yet.") +
    " Export one now and then, and import it on a new phone.";
}

function render() {
  renderStats(); renderList(); renderBackup(); paintCountries(); placeDots(); renderCard();
  $("maphint").innerHTML = S.ed ? "<b>Tap the map</b> to place or move the pin." : "";
}

/* ---------- selection card ---------- */
function select(id) { S.selected = id; renderCard(); placeDots(); }
function renderCard() {
  const c = $("card"), p = S.plants.find(x => x.id === S.selected);
  if (!p || S.ed) { c.hidden = true; return; }
  c.replaceChildren(); c.hidden = false;
  const h = document.createElement("h3"); h.textContent = p.name;
  const m = document.createElement("div"); m.className = "meta";
  m.textContent = `${p.place} · ${p.visits || 1} visit${(p.visits || 1) > 1 ? "s" : ""} · ${fmt(km(S.home, p))} km from ${S.home.place.split(",")[0]}`;
  const r = document.createElement("div"); r.className = "row";
  const plus = document.createElement("button"); plus.type = "button"; plus.className = "btn"; plus.textContent = "+1 visit";
  plus.onclick = () => { p.visits = (p.visits || 1) + 1; if (persist()) toast("Visit added"); render(); };
  const ed = document.createElement("button"); ed.type = "button"; ed.className = "btn"; ed.textContent = "Edit";
  ed.onclick = () => openEditor("edit", p);
  const x = document.createElement("button"); x.type = "button"; x.className = "btn"; x.textContent = "Close"; x.onclick = () => select(null);
  r.append(plus, ed, x);
  c.append(h, m, r);
}

/* ---------- editor ---------- */
let visits = 1, delArmed = false;
function setVisits(v) { visits = Math.max(1, Math.min(999, v)); $("vOut").textContent = visits; }
$("vMinus").onclick = () => setVisits(visits - 1);
$("vPlus").onclick = () => setVisits(visits + 1);
function locNote(t, err) { const n = $("locNote"); n.textContent = t; n.classList.toggle("err", !!err); }

function openEditor(mode, p) {
  const src = mode === "home" ? S.home : p;
  S.ed = { mode, id: p?.id, lat: src?.lat ?? null, lon: src?.lon ?? null, country: p?.country };
  S.selected = null; delArmed = false;
  $("fTitle").textContent = mode === "home" ? "Home base" : mode === "edit" ? "Edit plant" : "Add plant";
  $("nameLbl").hidden = mode === "home";
  $("visitsBox").hidden = mode === "home";
  $("fName").value = p?.name || "";
  $("fPlace").value = src?.place || "";
  setVisits(p?.visits || 1);
  $("delBtn").hidden = mode !== "edit"; $("delBtn").textContent = "Delete";
  $("formErr").hidden = true;
  $("hereBtn").hidden = !navigator.geolocation;
  locNote(S.ed.lat != null ? "The pin is on the map. Tap the map to move it." : "Type a city and tap Find, use your location, or tap the map.");
  document.body.classList.add("editing"); $("sheet").hidden = false;
  requestAnimationFrame(() => { layoutMap(); if (S.ed.lat != null) zoomToPoint(S.ed.lon, S.ed.lat, 6, 0); render(); });
}
function closeEditor() {
  S.ed = null; document.body.classList.remove("editing"); $("sheet").hidden = true;
  requestAnimationFrame(() => { layoutMap(); render(); });
}
$("addBtn").onclick = () => openEditor("add");
$("cancelBtn").onclick = closeEditor;

/* Place lookup: only the typed city text is sent to OpenStreetMap, never the plant name. */
const OSM = "https://nominatim.openstreetmap.org";
function placeLabel(a) {
  const city = a.city || a.town || a.village || a.municipality || a.county || a.state || "";
  return [city, a.country].filter(Boolean).join(", ");
}
$("findBtn").onclick = async () => {
  const q = $("fPlace").value.trim();
  if (!q) return locNote("Type a city first, for example Brno, Czech Republic.", true);
  if (!navigator.onLine) return locNote("You are offline. Tap the map to drop the pin.", true);
  const btn = $("findBtn"); btn.disabled = true; locNote("Looking it up…");
  try {
    const r = await fetch(`${OSM}/search?format=jsonv2&limit=1&addressdetails=1&accept-language=en&q=${encodeURIComponent(q)}`);
    const [hit] = await r.json();
    if (!hit) { locNote("Could not find that place. Add the country, or tap the map.", true); return; }
    const lat = +hit.lat, lon = +hit.lon;
    setPin(lon, lat, hit.address?.country);
    const label = placeLabel(hit.address || {}); if (label) $("fPlace").value = label;
    locNote("Found it. Not quite right? Tap the map to move the pin.");
    zoomToPoint(lon, lat, 6);
  } catch { locNote("Lookup failed. Check your connection, or tap the map.", true); }
  finally { btn.disabled = false; }
};
$("fPlace").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("findBtn").click(); } });

$("hereBtn").onclick = () => {
  const btn = $("hereBtn"); btn.disabled = true; locNote("Finding your location…");
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    setPin(lon, lat); zoomToPoint(lon, lat, 8);
    locNote("Pin set at your location.");
    btn.disabled = false;
    if (!$("fPlace").value.trim() && navigator.onLine) {
      try {
        const r = await fetch(`${OSM}/reverse?format=jsonv2&zoom=10&accept-language=en&lat=${lat}&lon=${lon}`);
        const label = placeLabel((await r.json()).address || {});
        if (label && !$("fPlace").value.trim()) $("fPlace").value = label;
      } catch {}
    }
  }, err => {
    btn.disabled = false;
    locNote(err.code === 1 ? "Location access is off for this app. Allow it in your phone settings, or tap the map." : "Could not get your location. Try again, or tap the map.", true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
};

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const ed = S.ed, err = $("formErr");
  const name = $("fName").value.trim(), place = $("fPlace").value.trim();
  const problem = ed.mode !== "home" && !name ? "Give the plant a name." : !place ? "Add the city and country." : ed.lat == null ? "Place the pin first: tap Find, use your location, or tap the map." : "";
  if (problem) { err.textContent = problem; err.hidden = false; return; }
  err.hidden = true;
  const lat = +ed.lat.toFixed(5), lon = +ed.lon.toFixed(5);
  if (ed.mode === "home") S.home = { place, lat, lon };
  else {
    const old = S.plants.find(p => p.id === ed.id);
    const rec = { id: ed.id || newId(), name, place, country: ed.country || "Unknown", lat, lon, visits, added: old?.added || new Date().toISOString().slice(0, 10) };
    S.plants = old ? S.plants.map(p => p.id === ed.id ? rec : p) : [...S.plants, rec];
  }
  if (persist()) toast(ed.mode === "home" ? "Home base saved" : ed.id ? "Saved" : "Plant added");
  closeEditor();
});

$("delBtn").onclick = () => {
  if (!delArmed) { delArmed = true; $("delBtn").textContent = "Tap again to delete"; return; }
  S.plants = S.plants.filter(p => p.id !== S.ed.id);
  if (persist()) toast("Plant deleted");
  closeEditor();
};

/* ---------- backup ---------- */
$("exportBtn").onclick = async () => {
  const day = new Date().toISOString().slice(0, 10);
  const name = `plant-atlas-${day}.json`;
  const blob = new Blob([JSON.stringify({ app: "plant-atlas", version: 1, exported: new Date().toISOString(), home: S.home, plants: S.plants }, null, 2)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: "Plant Atlas backup" });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    S.lastExport = new Date().toISOString(); persist(); renderBackup(); toast("Backup exported");
  } catch (e) { if (e?.name !== "AbortError") toast("Export failed. Try again."); }
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.plants)) throw 0;
    const incoming = d.plants.filter(validPlant).map(p => ({ ...p, id: p.id || newId(), country: p.country || "Unknown", place: p.place || "", visits: p.visits || 1 }));
    const byId = new Map(S.plants.map(p => [p.id, p]));
    let added = 0; for (const p of incoming) { if (!byId.has(p.id)) added++; byId.set(p.id, p); }
    S.plants = [...byId.values()];
    if (validHome(d.home)) S.home = d.home;
    if (persist()) toast(`Imported ${incoming.length} plants, ${added} new`);
    render(); fitPlants();
  } catch { toast("That file is not a Plant Atlas backup."); }
};

let toastT;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400); }

/* ---------- boot ---------- */
load(); render();
fetch("countries-50m.json").then(r => r.json()).then(topo => {
  S.features = topojson.feature(topo, topo.objects.countries).features.filter(f => f.id !== "010");
  layoutMap(); fitPlants(0);
}).catch(() => { $("maphint").textContent = "The world map could not load. Reload the app to try again."; });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
